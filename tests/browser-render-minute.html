<meta charset="utf-8"><h1>Spectral 60-second rate matrix</h1><pre id="result">Running</pre><script type="module">
import {renderOffline} from '../src/offline-render.js?v=20261006-48k-01';
const results=[];

let crossings=0,previous=0;for(let i=48000;i<96000;i++){const at=44+i*channels*3;let n=v.getUint8(at)|(v.getUint8(at+1)<<8)|(v.getUint8(at+2)<<16);if(n&0x800000)n-=0x1000000;if(n>0&&previous<=0)crossings++;previous=n;}

</script>
