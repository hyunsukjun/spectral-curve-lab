<meta charset="utf-8"><title>Spectral render rate boundary</title><h1>Spectral actual worker output</h1><pre id="result">Running</pre><script type="module">
import {renderOffline} from '../src/offline-render.js?v=20261006-48k-01';
const results=[];const flat=y=>[{x:0,y},{x:1,y}];
for(const rate of [44100,48000,88200,96000])for(const hz of rate>48000?[1000,30000]:[1000]){
const input=new AudioBuffer({numberOfChannels:2,length:rate,sampleRate:rate});for(let c=0;c<2;c++){const a=input.getChannelData(c);for(let i=0;i<a.length;i++)a[i]=.2*Math.sin(2*Math.PI*hz*i/rate);}
const output=await renderOffline({audioBuffer:input,curves:{shift:flat(.5),stretch:flat(.5),blur:flat(0),harmonicity:flat(.5),freeze:flat(0)},order:[]});
const bytes=await output.blob.arrayBuffer(),v=new DataView(bytes),channels=v.getUint16(22,true),sr=v.getUint32(24,true),bits=v.getUint16(34,true),frames=v.getUint32(40,true)/(channels*3);let sum=0;for(let i=4800;i<43200;i++){let at=44+i*channels*3,n=v.getUint8(at)|(v.getUint8(at+1)<<8)|(v.getUint8(at+2)<<16);if(n&0x800000)n-=0x1000000;sum+=(n/8388608)**2;}
const gainDb=20*Math.log10(Math.sqrt(sum/38400)/(.2/Math.sqrt(2)));results.push({rate,hz,channels,sr,bits,frames,gainDb,pass:sr===48000&&frames===48000&&bits===24&&(hz<24000?Math.abs(gainDb)<1:gainDb< -50)});
}
for(const rate of [44100,48000,88200,96000]) {
const input=new AudioBuffer({numberOfChannels:1,length:rate+7,sampleRate:rate});input.getChannelData(0).fill(.05);
const output=await renderOffline({audioBuffer:input,order:[]});const v=new DataView(await output.blob.arrayBuffer());const frames=v.getUint32(40,true)/3;
results.push({test:'mono fractional duration',rate,frames,pass:v.getUint16(22,true)===1&&frames===Math.round((rate+7)*48000/rate)&&input.getChannelData(0).length===rate+7});
}
const controller=new AbortController();controller.abort();let cancelled=false;
try{await renderOffline({audioBuffer:new AudioBuffer({numberOfChannels:1,length:96000,sampleRate:96000}),signal:controller.signal});}catch(error){cancelled=error.name==='AbortError';}
results.push({test:'cancel before preparation',pass:cancelled});
document.querySelector('#result').textContent=JSON.stringify(results,null,2);
</script>
