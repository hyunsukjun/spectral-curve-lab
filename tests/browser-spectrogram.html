<!doctype html><meta charset="utf-8"><title>Spectrogram verification</title><style>body{font:15px system-ui;padding:24px;background:#172026;color:#edf3f2}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Spectrogram worker / playback parity</h1><button id="run">Run comparison checks</button><pre id="result">Ready</pre><script type="module">
import {SpectrogramAnalysis} from '../src/spectrogram-core.js?v=20260929-transport1';
const flat=y=>[{x:0,y},{x:1,y}],rate=48000;
const runWorker=data=>new Promise((resolve,reject)=>{const w=new Worker('../src/spectrogram-worker.js?v=20260929-transport1',{type:'module'});w.onmessage=({data})=>{if(data.source){w.terminate();resolve(data);}else if(data.error){w.terminate();reject(Error(data.error));}};w.onerror=e=>{w.terminate();reject(Error(e.message));};w.postMessage(data);});
document.querySelector('#run').onclick=async()=>{const rows=[];document.querySelector('#run').disabled=true;try{
 for(const [name,shift,stretch,blur] of [['neutral',.5,.5,0],['shift',.55,.5,0],['stretch',.5,1,0],['blur',.5,.5,1],['combined',.55,.7,.8]]){
  const left=Float32Array.from({length:rate*2},(_,i)=>(i<rate?.25:0)*Math.sin(2*Math.PI*750*i/rate)),channels=[left,Float32Array.from(left,x=>-x)],curves={shift:flat(shift),stretch:flat(stretch),blur:flat(blur)};
  const result=await runWorker({channels,rate,curves});
  const ctx=new OfflineAudioContext(2,left.length,rate);await ctx.audioWorklet.addModule('./browser-worklet.js?v=20260929-transport1');const node=new AudioWorkletNode(ctx,'test-neutral',{numberOfInputs:0,outputChannelCount:[2],processorOptions:{channels,curve:curves.shift,stretchCurve:curves.stretch,blurCurve:curves.blur}});node.connect(ctx.destination);const audio=await ctx.startRendering(),analysis=new SpectrogramAnalysis(2,left.length,rate);analysis.push([audio.getChannelData(0),audio.getChannelData(1)]);const expected=analysis.finish();let maxError=0;for(let i=0;i<expected.data.length;i++)maxError=Math.max(maxError,Math.abs(expected.data[i]-result.output.data[i]));
  let neutralError=0;if(name==='neutral')for(let i=0;i<result.source.data.length;i++)neutralError=Math.max(neutralError,Math.abs(result.source.data[i]-result.output.data[i]));
  rows.push({name,maxError,neutralError,pass:maxError<1e-4&&neutralError<1e-4});document.querySelector('#result').textContent=JSON.stringify({rows,pass:rows.every(r=>r.pass)},null,2);
 }
}catch(e){document.querySelector('#result').textContent=e.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
