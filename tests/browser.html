<!doctype html><html lang="en"><meta charset="utf-8"><title>Spectral Curve Lab validation</title>
<style>body{font:16px system-ui;background:#172026;color:#edf3f2;padding:30px}pre{white-space:pre-wrap}button{padding:12px}</style>
<h1>Spectral Curve Lab · browser validation</h1><button id="run">Run neutral checks</button><pre id="result">Ready</pre>
<script type="module">
import {NeutralSTFT} from '../src/spectral-core.js?v=20260929-transport1';
import {renderOffline} from '../src/offline-render.js?v=20260929-transport1';
const result=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{
 try {
  result.textContent='Running…';
  const ctx=new AudioContext({sampleRate:48000}); await ctx.resume();
  const source=await ctx.decodeAudioData(await (await fetch('./fixtures/cello.wav')).arrayBuffer());
  const channels=Array.from({length:source.numberOfChannels},(_,c)=>source.getChannelData(c));
  const engine=new NeutralSTFT(channels); const times=[];
  for(let p=0;p<source.length;p+=engine.hop){const t=performance.now();engine.nextHop();times.push(performance.now()-t);}
  times.sort((a,b)=>a-b);
  const offline=new OfflineAudioContext(2,source.length,48000);
  await offline.audioWorklet.addModule('./browser-worklet.js?v=20260929-transport1');
  const node=new AudioWorkletNode(offline,'test-neutral',{numberOfInputs:0,outputChannelCount:[2],processorOptions:{channels}});
  node.connect(offline.destination);
  const preview=await offline.startRendering();
  const measure=(output)=>{
   let peak=0,sum=0;
   for(let c=0;c<output.numberOfChannels;c++){const input=channels[c]||channels[0], out=output.getChannelData(c);for(let i=0;i<input.length;i++){const error=out[i]-input[i];peak=Math.max(peak,Math.abs(error));sum+=error*error;}}
   return {peakError:peak,rmsError:Math.sqrt(sum/(source.length*output.numberOfChannels))};
  };
  const render=await renderOffline({audioBuffer:source});
  const bytes=await render.blob.arrayBuffer();const header=new DataView(bytes);
  const rendered=await ctx.decodeAudioData(bytes.slice(0));
  const previewError=measure(preview), renderError=measure(rendered);
  const abort=new AbortController(); const cancellation=renderOffline({audioBuffer:source,signal:abort.signal}).then(()=>false,e=>e.name==='AbortError');abort.abort();
  const cancelled=await cancellation;
  const report={file:'cello.wav',sampleRate:source.sampleRate,channels:source.numberOfChannels,duration:source.duration,actualBrowserWorklet:previewError,workerWav:renderError,wav:{sampleRate:header.getUint32(24,true),bits:header.getUint16(34,true),channels:header.getUint16(22,true),length:rendered.length},cancelled,mainThreadCoreBenchmark:{meanHopMs:times.reduce((a,b)=>a+b,0)/times.length,p99HopMs:times[Math.floor(times.length*.99)],maxHopMs:times.at(-1),note:'Main-thread DSP benchmark; not AudioWorklet CPU profiling.'}};
  report.pass=previewError.peakError<1e-6&&renderError.peakError<2e-7&&header.getUint16(34,true)===24&&rendered.length===source.length&&cancelled;
  result.textContent=JSON.stringify(report,null,2);await ctx.close();
 }catch(e){result.textContent=e.stack;}
};
</script></html>
